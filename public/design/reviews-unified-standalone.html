<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Макет отзывов — клиника «Яблоко»</title><meta name="description" content="Изолированный демонстрационный макет раздела отзывов для согласования."><style>html { font-size:16px; } body { margin:0; } .reviews-unified-demo { --background:40 33% 97%; --foreground:0 0% 20%; --card:0 0% 100%; --secondary:95 30% 95%; --secondary-foreground:95 55% 35%; --muted-foreground:0 0% 45%; --border:40 15% 88%; --primary-foreground:0 0% 100%; --apple-green-dark:95 60% 32%; line-height:1.6; -webkit-font-smoothing:antialiased; }
.reviews-unified-demo button, .reviews-unified-demo select { font:inherit; cursor:pointer; }
.reviews-unified-demo :where(button, a.demo-cta, a.demo-action) { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:8px; font-weight:600; text-decoration:none; padding:8px 20px; border:0 solid; background:transparent; color:inherit; line-height:1.5; transition:all .2s; }
.reviews-unified-demo svg { width:16px; height:16px; flex-shrink:0; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.reviews-unified-demo .demo-cta { border-color:hsl(var(--primary)); color:hsl(var(--primary)); }
.reviews-unified-demo .demo-cta:hover { background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); }
.reviews-unified-demo .demo-action { color:hsl(var(--primary)); }
.reviews-unified-demo .demo-action:hover { text-decoration:underline; text-underline-offset:4px; }
.reviews-unified-demo .demo-ghost:hover { background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground)); text-decoration:none; }
.reviews-unified-demo .demo-tab:hover { background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground)); }
.reviews-unified-demo :is(button,a,select,[tabindex]):focus-visible { outline:2px solid hsl(var(--ring)); outline-offset:2px; }
.reviews-unified-demo .demo-select { min-height:48px; width:160px; border:1px solid hsl(var(--border)); border-radius:6px; padding:8px 12px; background:hsl(var(--card)); color:hsl(var(--foreground)); font-size:16px; }
.reviews-unified-demo .demo-sort .demo-select { width:176px; }
.reviews-unified-demo [hidden] { display:none !important; }
.reviews-unified-demo {
  --primary: 95 54% 31%;
  --ring: 0 0% 20%;
  --demo-rating: var(--apple-green-dark);
  color: hsl(var(--foreground));
  background: hsl(var(--background));
  min-height: 100vh;
  font-family: Inter, system-ui, sans-serif;
  font-size: 16px;
  letter-spacing: 0;
}
.reviews-unified-demo * { box-sizing: border-box; }
.reviews-unified-demo .demo-shell { max-width: 1280px; margin: 0 auto; padding: 24px 32px 48px; }
.reviews-unified-demo .demo-banner { border-left: 4px solid hsl(var(--primary)); background: hsl(var(--secondary)); padding: 16px 20px; line-height: 1.5; }
.reviews-unified-demo .demo-tools { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin: 16px 0 28px; }
.reviews-unified-demo .demo-section { padding: 0; }
.reviews-unified-demo .demo-heading { margin-bottom: 24px; }
.reviews-unified-demo .demo-eyebrow { color: hsl(var(--primary)); font-weight: 600; margin: 0 0 6px; }
.reviews-unified-demo h2 { font-size: 36px; line-height: 1.2; font-weight: 650; margin: 0 0 12px; }
.reviews-unified-demo .demo-subtitle { margin: 0; color: hsl(var(--muted-foreground)); line-height: 1.5; }
.reviews-unified-demo .demo-source-row { display: flex; gap: 20px; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.reviews-unified-demo .demo-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex: 1; max-width: 820px; }
.reviews-unified-demo .demo-tab { min-height: 56px; height: auto; padding: 12px; font-size: 16px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: none; gap: 12px; }
.reviews-unified-demo .demo-tab[aria-selected="true"] { border-color: hsl(var(--primary)); background: hsl(var(--secondary)); color: hsl(var(--primary)); }
.reviews-unified-demo .demo-tab img { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
.reviews-unified-demo .demo-cta { min-height: 48px; height: auto; font-size: 16px; border-width: 1px; box-shadow: none; }
.reviews-unified-demo .demo-panel { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 8px; overflow: hidden; }
.reviews-unified-demo .demo-summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px; border-bottom: 1px solid hsl(var(--border)); }
.reviews-unified-demo .demo-summary-main { display: flex; align-items: center; gap: 16px; }
.reviews-unified-demo .demo-score { font-size: 36px; line-height: 1; font-weight: 650; }
.reviews-unified-demo .demo-stars { display: flex; gap: 3px; color: hsl(var(--demo-rating)); }
.reviews-unified-demo .demo-stars svg { width: 16px; height: 16px; fill: currentColor; }
.reviews-unified-demo .demo-caption { font-size: 14px; color: hsl(var(--muted-foreground)); margin: 6px 0 0; }
.reviews-unified-demo .demo-sort { display: flex; align-items: center; gap: 12px; }
.reviews-unified-demo .demo-review { padding: 24px 28px; border-bottom: 1px solid hsl(var(--border)); }
.reviews-unified-demo .demo-person { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.reviews-unified-demo .demo-avatar { display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: hsl(var(--secondary)); color: hsl(var(--primary)); font-size: 14px; font-weight: 600; }
.reviews-unified-demo .demo-author { font-weight: 600; margin: 0; }
.reviews-unified-demo .demo-date { color: hsl(var(--muted-foreground)); font-size: 14px; }
.reviews-unified-demo .demo-person .demo-stars { margin-left: auto; }
.reviews-unified-demo .demo-text { margin: 0; font-size: 16px; line-height: 1.65; max-width: 960px; }
.reviews-unified-demo .demo-text.is-collapsed { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.reviews-unified-demo .demo-action { min-height: 48px; height: auto; padding: 10px 0; font-size: 16px; justify-content: flex-start; white-space: normal; text-align: left; }
.reviews-unified-demo .demo-review-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; }
.reviews-unified-demo .demo-reply { padding: 16px 20px; border-left: 2px solid hsl(var(--primary)); background: hsl(var(--secondary)); margin: 8px 0; line-height: 1.6; }
.reviews-unified-demo .demo-reply p { margin: 6px 0 0; }
.reviews-unified-demo .demo-more { display: flex; justify-content: center; padding: 16px 24px; }
.reviews-unified-demo .demo-empty { min-height: 300px; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.reviews-unified-demo .demo-empty p { margin: 0; }
.reviews-unified-demo .demo-empty svg { color: hsl(var(--primary)); width: 28px; height: 28px; }
.reviews-unified-demo .demo-spinner { animation: demo-spin 1.2s linear infinite; }
@keyframes demo-spin { to { transform: rotate(360deg); } }
@media (max-width: 1000px) {
  .reviews-unified-demo .demo-source-row { flex-direction: column; align-items: stretch; gap: 12px; }
  .reviews-unified-demo .demo-tabs { max-width: none; }
  .reviews-unified-demo .demo-cta { align-self: flex-end; }
}
@media (max-width: 600px) {
  .reviews-unified-demo .demo-shell { padding: 16px 16px 32px; }
  .reviews-unified-demo .demo-banner { padding: 12px 14px; font-size: 14px; }
  .reviews-unified-demo .demo-tools { justify-content: space-between; margin-bottom: 24px; font-size: 14px; }
  .reviews-unified-demo h2 { font-size: 28px; }
  .reviews-unified-demo .demo-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reviews-unified-demo .demo-tab { justify-content: flex-start; font-size: 16px; padding: 12px 10px; gap: 8px; }
  .reviews-unified-demo .demo-summary, .reviews-unified-demo .demo-review { padding: 20px 16px; }
  .reviews-unified-demo .demo-sort { justify-content: space-between; width: 100%; }
  .reviews-unified-demo .demo-person { flex-wrap: wrap; gap: 8px; }
  .reviews-unified-demo .demo-person .demo-stars { width: 100%; margin-left: 52px; }
  .reviews-unified-demo .demo-caption { max-width: 220px; }
}
@media (prefers-reduced-motion: reduce) {
  .reviews-unified-demo .demo-spinner { animation: none; }
  .reviews-unified-demo * { transition: none; }
}</style></head><body><main class="reviews-unified-demo"><div class="demo-shell">

const demoTexts=["Спасибо за внимательное отношение и понятные объяснения. Было удобно выбрать время и найти клинику. Перед визитом мне спокойно ответили на вопросы и уточнили детали. На месте всё было организовано понятно: встретили вовремя, подсказали, куда пройти, и не торопили. Особенно понравилось, что можно было задать дополнительные вопросы и получить подробный ответ. Осталось приятное впечатление от общения и организации визита.", "Было легко связаться с клиникой и договориться об удобном времени. Адрес и ориентиры объяснили заранее. Спасибо за спокойное и доброжелательное общение.", "В клинике чисто и спокойно. Меня встретили вовремя, внимательно выслушали и понятно ответили на вопросы. Все организационные детали были ясны ещё до визита.", "Удобно, что информацию о визите можно уточнить заранее. Сотрудники были вежливы и помогли разобраться с расписанием. Спасибо за внимание к деталям.", "Понравилось, что общение было спокойным и без спешки. Нашлось время на все мои вопросы. Клиника оказалась там, где было указано, и добраться было несложно.", "Запись прошла понятно, напоминание о времени было кстати. На месте не пришлось долго ждать. Благодарю за аккуратную организацию и доброжелательную встречу."];
let sourceIndex=0, state='ready', sort='newest', showAll=false;
const expanded=new Set(), replies=new Set();
const icon=(name)=>{const paths={external:'<path d="M15 3h6v6M10 14 11-11M21 14v7H3V3h7"/>',down:'<path d="m6 9 6 6 6-6"/>',arrowDown:'<path d="M12 5v14m-7-7 7 7 7-7"/>',arrowUp:'<path d="M12 19V5m-7 7 7-7 7 7"/>',message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/>',loader:'<path d="M12 2a10 10 0 1 1-7.1 2.9"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;};
const stars=rating=>`<span class="demo-stars" aria-label="Демонстрационная оценка: ${rating} из 5">${icon('star').repeat(rating)}</span>`;
const tabs=document.querySelector('.demo-tabs');
tabs.innerHTML=sources.map((s,i)=>`<button type="button" class="demo-tab" role="tab" id="source-${i}" aria-controls="demo-reviews-panel" aria-selected="${i===0}" tabindex="${i===0?0:-1}"><img src="${s.logo}" width="28" height="28" alt="">${s.name}</button>`).join('');
function chooseSource(i){sourceIndex=i;showAll=false;expanded.clear();replies.clear();render();}
tabs.addEventListener('click',e=>{const tab=e.target.closest('[role=tab]');if(tab)chooseSource([...tabs.children].indexOf(tab));});
tabs.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp','Home','End'].includes(e.key))return;e.preventDefault();const i=[...tabs.children].indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?3:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:3))%4;chooseSource(next);tabs.children[next].focus();});
function review(index){const id=`${sourceIndex}-${index}`,text=demoTexts[(index+sourceIndex)%6],long=text.length>350;return `<article class="demo-review"><div class="demo-person"><span class="demo-avatar" aria-hidden="true">АП</span><div><p class="demo-author">Анонимный посетитель ${index+1}</p><time class="demo-date" datetime="2026-10-${String(18-index).padStart(2,'0')}">${18-index} октября 2026 · демо</time></div>${stars(index===4?4:5)}</div><p id="text-${id}" class="demo-text ${long&&!expanded.has(index)?'is-collapsed':''}">${text}</p>${long?`<button type="button" class="demo-action" data-expand="${index}" aria-expanded="${expanded.has(index)}" aria-controls="text-${id}">${expanded.has(index)?'Свернуть текст':'Читать полностью'}</button>`:''}<div class="demo-review-actions"><a class="demo-action" href="${sources[sourceIndex].href}" target="_blank" rel="noopener noreferrer">Открыть оригинал ${icon('external')}<span class="demo-caption">демоссылка</span></a>${index%2===0?`<button type="button" class="demo-action demo-ghost" data-reply="${index}" aria-expanded="${replies.has(index)}" aria-controls="reply-${id}">${icon('message')}Ответ клиники${icon('down')}</button>`:''}</div>${replies.has(index)?`<div id="reply-${id}" class="demo-reply"><strong>Клиника «Яблоко» · демонстрационный ответ</strong><p>Спасибо за обратную связь и добрые слова. Нам важно, чтобы общение было понятным и комфортным.</p></div>`:''}</article>`;}
const panel=document.getElementById('demo-reviews-panel');
function render(){const source=sources[sourceIndex];[...tabs.children].forEach((t,i)=>{t.setAttribute('aria-selected',String(i===sourceIndex));t.tabIndex=i===sourceIndex?0:-1;});panel.setAttribute('aria-labelledby',`source-${sourceIndex}`);document.getElementById('score').textContent=source.score;document.getElementById('summary-stars').innerHTML=stars(5);document.getElementById('source-caption').innerHTML=`${source.name} · демонстрационная сводка<br>6 демоотзывов · оценка условная`;document.querySelector('.demo-sort').hidden=state!=='ready';document.getElementById('state').value=state;const indices=sort==='oldest'?[5,4,3,2,1,0]:sort==='rating'?[0,1,2,3,5,4]:[0,1,2,3,4,5];document.getElementById('review-content').innerHTML=state==='ready'?indices.slice(0,showAll?6:3).map(review).join('')+`<div class="demo-more"><button type="button" class="demo-cta" data-more aria-expanded="${showAll}">${icon(showAll?'arrowUp':'arrowDown')}${showAll?'Свернуть':'Показать ещё 3'}</button></div>`:`<div class="demo-empty" role="${state==='error'?'alert':'status'}" aria-live="polite"><span class="${state==='loading'?'demo-spinner':''}">${icon(state==='loading'?'loader':'info')}</span><strong>${state==='loading'?'Загружаем отзывы…':state==='empty'?'Пока нет отзывов для отображения':'Не удалось загрузить отзывы'}</strong><p class="demo-caption">Демонстрационное состояние · ${source.name}</p>${state==='error'?'<button type="button" class="demo-cta" data-retry>Попробовать снова</button>':''}</div>`;}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let selector;if(b.hasAttribute('data-expand')){const i=Number(b.dataset.expand);expanded.has(i)?expanded.delete(i):expanded.add(i);selector=`[data-expand="${i}"]`;}else if(b.hasAttribute('data-reply')){const i=Number(b.dataset.reply);replies.has(i)?replies.delete(i):replies.add(i);selector=`[data-reply="${i}"]`;}else if(b.hasAttribute('data-more')){showAll=!showAll;selector='[data-more]';}else if(b.hasAttribute('data-retry')){state='ready';}else return;render();if(selector)panel.querySelector(selector)?.focus({preventScroll:true});});
document.getElementById('state').addEventListener('change',e=>{state=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;render();});
document.getElementById('review-link-icon').innerHTML=icon('external');render();
</script></body></html>
