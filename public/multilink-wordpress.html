<!-- Self-contained WordPress Custom HTML fragment. No runtime dependencies. -->
<style>
.yc-review-links {
  --yc-review-bg: #ffffff;
  --yc-review-text: #333333;
  --yc-review-muted: #666666;
  --yc-review-green: #5fa030;
  --yc-review-on-green: #ffffff;
  box-sizing: border-box;
  width: 100%;
  background: var(--yc-review-bg);
  color: var(--yc-review-text);
  font-family: inherit;
  line-height: 1.6;
  padding: 32px 20px calc(112px + env(safe-area-inset-bottom, 0px));
}
.yc-review-links *, .yc-review-links *::before, .yc-review-links *::after { box-sizing: border-box; }
.yc-review-links .yc-review-links__inner { width: 100%; max-width: 504px; margin: 0 auto; }
.yc-review-links .yc-review-links__logo { display: block; width: 96px; height: 96px; object-fit: contain; margin: 0 auto; }
.yc-review-links .yc-review-links__title { margin: 24px 0 0; font-family: inherit; font-size: 24px; font-weight: 600; line-height: 1.35; letter-spacing: 0; text-align: center; color: var(--yc-review-text); overflow-wrap: break-word; }
.yc-review-links .yc-review-links__intro { margin: 12px 0 0; font-size: 16px; color: var(--yc-review-muted); text-align: center; }
.yc-review-links .yc-review-links__platforms { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.yc-review-links .yc-review-links__platform { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 56px; border: 2px solid var(--yc-review-green); border-radius: 8px; padding: 16px 20px; color: var(--yc-review-green); background: var(--yc-review-bg); font-size: 16px; font-weight: 600; line-height: 1.5; text-decoration: none; overflow-wrap: anywhere; }
.yc-review-links .yc-review-links__platform:hover { color: var(--yc-review-on-green); background: var(--yc-review-green); }
.yc-review-links .yc-review-links__platform > span:last-child { flex-shrink: 0; }
.yc-review-links .yc-review-links__home { display: flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; max-width: 100%; min-height: 48px; margin: 24px auto 0; padding: 8px 12px; color: var(--yc-review-muted); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; }
.yc-review-links a:focus-visible { outline: 3px solid var(--yc-review-text); outline-offset: 4px; }
@media (min-width: 640px) {
  .yc-review-links { padding-top: 48px; }
  .yc-review-links .yc-review-links__title { font-size: 30px; }
}
</style>
